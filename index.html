<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/wissam654321/Project-Fortnite-Launcheur/refs/heads/main/NITFORT-%C2%A9-LG.ico">
  <title>NITFORT - Maintenance</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #080915;
      --card-bg: rgba(14, 16, 32, 0.85);
      --card-border: rgba(139, 92, 246, 0.25);
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      /* Rend les polices nettes et fluides sur tous les écrans */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      user-select: none;
    }

    .blabla {
      font-size: 0.75rem;
      color: rgba(156, 163, 175, 0.6);
      letter-spacing: 0.3px;
    }

    .blabla strong {
      color: var(--accent-cyan);
      font-weight: 600;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #galaxy-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .nebula-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.25) 0%, transparent 55%),
        radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.2) 0%, transparent 55%);
      z-index: 2;
      pointer-events: none;
    }

    .maintenance-card {
      position: relative;
      z-index: 10;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      padding: 45px 40px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(139, 92, 246, 0.12);
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-container {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-img {
      max-width: 210px;
      height: auto;
      filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.3));
    }

    .divider {
      width: 45px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
      margin: 0 auto 22px;
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    p {
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 400;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .progress-section {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 25px;
      text-align: left;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
      border-radius: 4px;
      box-shadow: 0 0 10px var(--accent-cyan);
      transition: width 0.4s ease;
    }
  </style>
</head>
<body>

  <canvas id="galaxy-canvas"></canvas>
  <div class="nebula-overlay"></div>

  <div class="maintenance-card">
    <div class="logo-container">
      <img src="https://github.com/wissam654321/Project-Fortnite-Launcheur/raw/main/NITFORT%20%C2%A9.png" alt="NITFORT Logo" class="logo-img" oncontextmenu="return false;" draggable="false" onerror="this.style.display='none'; document.getElementById('alt-title').style.display='block';">
      <h1 id="alt-title" style="display:none; font-size: 2rem; letter-spacing: 2px; color: #fff;">NITFORT</h1>
    </div>

    <div class="divider"></div>

    <h1>Maintenance en cours</h1>
    <p>De nouvelles fonctionnalités sont en développement ou Des Bugs en cours de correction.</p>
    
    <!-- Barre de progression connectée en temps réel -->
    <div class="progress-section">
      <div class="progress-header">
        <span style="color:var(--text-muted);"><i class="fa-solid fa-gears" style="color:var(--accent-cyan); margin-right:5px;"></i> Progression globale</span>
        <span id="progress-percent" style="color:var(--accent-cyan);">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
    </div>

    <div class="blabla">
      <span>© 2026 <strong>NITFORT</strong> — Tous droits réservés</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('galaxy-canvas');
    const ctx = canvas.getContext('2d');
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    });

    const stars = Array.from({ length: 120 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.5,
      s: Math.random() * 0.3 + 0.05
    }));

    function draw() {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#ffffff';
      stars.forEach(st => {
        st.y -= st.s;
        if (st.y < 0) st.y = h;
        ctx.beginPath();
        ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }
    draw();
  </script>

  <!-- Script Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBOX_05RBJJj0J_8TILiEm1-49vWf-cmoU",
      authDomain: "nitfort.firebaseapp.com",
      projectId: "nitfort",
      storageBucket: "nitfort.firebasestorage.app",
      messagingSenderId: "448178317339",
      appId: "1:448178317339:web:c3b2e432335c99e581f0be"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    onSnapshot(doc(db, "settings", "maintenance"), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        const progressVal = Number(data.progress) || 0;

        document.getElementById('progress-percent').innerText = progressVal + '%';
        document.getElementById('progress-bar').style.width = progressVal + '%';

        if (progressVal >= 100) {
          setTimeout(() => {
            window.location.reload();
          }, 1000);
        }
      } else {
        console.log("Le document 'maintenance' n'existe pas dans la collection 'settings'.");
      }
    }, (error) => {
      console.error("Erreur Firebase : ", error);
    });
  </script>

</body>
</html>
